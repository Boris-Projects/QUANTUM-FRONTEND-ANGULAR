<div class="table-container">
    <table
        mat-table [dataSource]="dataSource" matSort (matSortChange)="handleSortChange($event)"
    >

        <ng-container
            *ngFor="let col of columns" [matColumnDef]="col.key"
        >
             <th mat-header-cell *matHeaderCellDef [mat-sort-header]="col.key" [disabled]="!col.sortable">
                {{ col.label }}
            </th>
            <td mat-cell *matCellDef="let element">
                <ng-container *ngIf="getCellTemplate(col.key); else defaultCell">
                    <ng-container *ngTemplateOutlet="getCellTemplate(col.key); context: { $implicit: element }"></ng-container>
                </ng-container>
                <ng-template #defaultCell>{{ element[col.key] }}</ng-template>
            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [length]="totalItems" [pageSizeOptions]="[5, 10, 20]" (page)="handlePageEvent($event)"
        showFirstLastButtons>
    </mat-paginator>
</div>
